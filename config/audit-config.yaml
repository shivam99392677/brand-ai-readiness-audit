# Brand AI Readiness Audit Default Configuration

version: "0.1.0"

crawl:
  max_depth: 3
  max_pages: 100
  same_domain_only: true
  respect_robots: true
  request_timeout_seconds: 10
  max_requests_per_second: 2
  discover_sitemap: true

crawler:
  user_agents:
    - "GPTBot"
    - "ClaudeBot"
    - "PerplexityBot"
    - "Google-Extended"
    - "Bytespider"
  timeout_seconds: 30
  max_depth: 3
  render_js: true

scoring_weights:
  crawl_render_accessibility: 0.20
  structured_data: 0.20
  fact_quality: 0.20
  freshness_corroboration: 0.15
  entity_identity: 0.15
  engagement_readiness: 0.10

thresholds:
  critical_severity_cap: 40
  stale_content_months: 12

browser:
  enabled: true
  browser_type: chromium
  page_timeout_seconds: 15
  navigation_timeout_seconds: 15
  max_rendered_pages: 10
