[project]
name = "brand-ai-readiness-audit"
version = "0.2.0"
description = "Comprehensive Brand AI Readiness Audit system evaluating Off-site Discoverability and On-site Engagement using URL-only input."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ankit Kumar", email = "ankit07chy@gmail.com" },
    { name = "Shivam" }
]
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
audit = "src.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
